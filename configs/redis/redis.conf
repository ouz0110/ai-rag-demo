bind 0.0.0.0
protected-mode no
port 6379
timeout 0

requirepass "123456"
maxclients 10000

daemonize no
pidfile /var/run/redis.pid
loglevel notice
logfile "/var/log/redis/redis.log"

databases 16
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

aof-use-rdb-preamble no

maxmemory 256M
maxmemory-policy allkeys-lru
