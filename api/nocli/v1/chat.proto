syntax = "proto3";

package ai_rag_demo_api.nocli.v1;
option go_package = "nocli/v1;nocli";

import "google/api/annotations.proto";
import "validate/validate.proto";
import "common/v1/common.proto";

// Nocli AI补全服务
service NocliChat {
  // 发送消息 (一问一答，返回 StreamChunk)
  rpc Completion(CompletionRequest) returns (StreamChunk) {
    option (google.api.http) = {
      post: "/nocli/v1/completion"
      body: "*"
    };
  }

  // 恢复中断并继续对话 (一问一答，返回 StreamChunk)
  rpc Resume(ResumeRequest) returns (StreamChunk) {
    option (google.api.http) = {
      post: "/nocli/v1/resume"
      body: "*"
    };
  }

  // 流式发送消息 (SSE/Stream)
  rpc StreamCompletion(CompletionRequest) returns (stream StreamChunk) {
    option (google.api.http) = {
      post: "/nocli/v1/stream/completion"
      body: "*"
    };
  }

  // 流式恢复中断并继续对话 (SSE/Stream)
  rpc StreamResume(ResumeRequest) returns (stream StreamChunk) {
    option (google.api.http) = {
      post: "/nocli/v1/stream/resume"
      body: "*"
    };
  }

  // 获取历史会话列表 (带参 POST)
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {
      post: "/nocli/v1/sessions"
      body: "*"
    };
  }

  // 删除指定会话
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse) {
    option (google.api.http) = {
      post: "/nocli/v1/session/delete"
      body: "*"
    };
  }

  // 获取指定会话的历史记录与中断状态 (带参 POST)
  rpc GetSessionHistory(GetSessionHistoryRequest) returns (GetSessionHistoryResponse) {
    option (google.api.http) = {
      post: "/nocli/v1/session/history"
      body: "*"
    };
  }
}

// 会话状态
enum SessionStatus {
  SS_UNSPECIFIED = 0;
  SS_IDLE = 1;        // 空闲/已完成
  SS_RUNNING = 2;     // 处理中
  SS_INTERRUPTED = 3; // 已中断，等待人工决策
}

// 中断事件状态
enum InterruptStatus {
  IS_UNSPECIFIED = 0;
  IS_PENDING = 1;  // 待审批
  IS_APPROVED = 2; // 已批准
  IS_REJECTED = 3; // 已拒绝
  IS_EXPIRED = 4;  // 已超时/取消
}

// 恢复执行动作
enum ResumeAction {
  RA_UNSPECIFIED = 0;
  RA_APPROVE = 1; // 批准执行
  RA_REJECT = 2;  // 拒绝执行
}

// 授权范围
enum ApproveScope {
  AS_UNSPECIFIED = 0;
  AS_SINGLE_CALL = 1;  // 仅同意本次调用
  AS_SESSION_TOOL = 2; // 同意本轮/本会话后续所有同名工具调用
}

// SSE 流式事件类型
enum StreamEventType {
  SET_UNSPECIFIED = 0;
  SET_TEXT_DELTA = 1;  // 文本回复增量 (打字机)
  SET_REASONING = 2;   // 思考/推理过程增量 (CoT)
  SET_TOOL_START = 3;  // 自动工具开始执行
  SET_TOOL_RESULT = 4; // 自动工具执行完成
  SET_INTERRUPT = 5;   // 触发中断挂起 (人工授权)
  SET_DONE = 6;        // 流传输正常完成
  SET_ERROR = 7;       // 异常错误
  SET_CONTEXT_COMPRESSED = 8; // 上下文压缩触发事件
}

// 待确认的工具调用信息
message PendingToolCall {
  string interrupt_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string arguments = 4;
}

// 流式工具执行信息
message StreamToolInfo {
  string tool_call_id = 1;
  string tool_name = 2;
  string arguments = 3;
  string result_preview = 4;
}

// 流式错误信息
message StreamError {
  int32 code = 1;
  string message = 2;
}

// 上下文压缩详情
message CompressInfo {
  int32 original_tokens = 1;      // 压缩前 Token 数
  int32 compressed_tokens = 2;    // 压缩后 Token 数
  int32 compressed_msg_count = 3; // 被压缩消息数
  int32 compress_count = 4;        // 当前已压缩总次数
  string summary_preview = 5;     // 摘要内容预览
  bool is_max_limit_reached = 6;   // 是否达到了最大压缩次数限制 (触发熔断)
}

// 统一数据 Chunk (对应 SSE data 部分与非流式返回的统一 JSON 结构)
message StreamChunk {
  // 事件类型
  StreamEventType event = 1;
  // 当前 Agent 名称 (例如: main, rag_agent, code_analyzer)
  string agent_name = 2;
  // 会话ID
  string session_id = 3;
  // 会话当前状态
  SessionStatus status = 4;
  // 文本回复增量或完整回答文本
  string text = 5;
  // 思考过程增量或完整思考文本
  string reasoning_text = 6;
  // 自动工具执行信息 (event == SET_TOOL_START / SET_TOOL_RESULT)
  StreamToolInfo tool_info = 7;
  // 待确认的工具调用列表 (当 status 为 SS_INTERRUPTED 或 event 为 SET_INTERRUPT 时有效)
  repeated PendingToolCall pending_tool_calls = 8;
  // 错误信息 (event == SET_ERROR)
  StreamError error = 9;
  // 角色类型 ("user", "assistant", "tool", "system")
  string role = 10;
  // 压缩事件详情 (event == SET_CONTEXT_COMPRESSED)
  CompressInfo compress_info = 11;
}

// 补全请求
message CompletionRequest {
  // 消息内容
  string message = 1 [(validate.rules).string.min_len = 1, (validate.rules).string.max_len = 4096];
  // 会话ID
  string session_id = 2;
  // 模型名称
  string model = 3;
  // 知识库租户ID (可选。若不传或为空，服务端自动使用默认租户ID 'default_tenant')
  string kb_tenant_id = 4;
  // 关联知识库ID标识 (可选。若不传或为空，服务端自动使用默认知识库 'kb_default_system')
  string kb_id = 5;
  // 是否启用 RAG 知识库检索 (默认 false。仅在显式开启时才允许触发 RAG 检索)
  bool enable_rag = 6;
}

// 恢复执行请求
message ResumeRequest {
  // 会话ID
  string session_id = 1 [(validate.rules).string.min_len = 1];
  // 中断事件ID
  string interrupt_id = 2 [(validate.rules).string.min_len = 1];
  // 恢复动作 (APPROVE/REJECT)
  ResumeAction action = 3;
  // 授权范围 (SINGLE_CALL/SESSION_TOOL)
  ApproveScope approve_scope = 4;
  // 拒绝原因或用户意见
  string reason = 5;
  // 模型名称
  string model = 6;
  // 知识库租户ID (可选。若不传或为空，服务端自动使用默认租户ID 'default_tenant')
  string kb_tenant_id = 7;
  // 关联知识库ID标识 (可选。若不传或为空，服务端自动使用默认知识库 'kb_default_system')
  string kb_id = 8;
  // 是否启用 RAG 知识库检索 (默认 false)
  bool enable_rag = 9;
}

// 会话概览信息
message SessionInfo {
  string session_id = 1;
  string name = 2;
  SessionStatus status = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

// 会话列表请求
message ListSessionsRequest {
  ai_rag_demo_api.Pagination page = 1;
}

// 会话列表响应
message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
  int32 total = 2;
}

// 删除会话请求
message DeleteSessionRequest {
  string session_id = 1 [(validate.rules).string.min_len = 1];
}

// 删除会话响应
message DeleteSessionResponse {
  bool success = 1;
  string session_id = 2;
}

// 会话历史消息项
message SessionMessage {
  int64 id = 1;
  string role = 2;
  string content = 3;
  string reasoning_content = 4;
  string tool_calls_json = 5;
  string tool_call_id = 6;
  int64 created_at = 7;
}

// 获取会话历史请求
message GetSessionHistoryRequest {
  string session_id = 1 [(validate.rules).string.min_len = 1];
  ai_rag_demo_api.Pagination page = 2;
}

// 获取会话历史响应 (方案A: 返回用于前端统一渲染与回放的 StreamChunk 切片)
message GetSessionHistoryResponse {
  string session_id = 1;
  SessionStatus status = 2;
  repeated StreamChunk chunks = 3;
  repeated PendingToolCall pending_tool_calls = 4;
  int32 total = 5;
  bool has_more = 6;
}
