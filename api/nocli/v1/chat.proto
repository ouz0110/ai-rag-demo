syntax = "proto3";

package ai_rag_demo_api.nocli.v1;
option go_package = "nocli/v1;nocli";

import "google/api/annotations.proto";
import "validate/validate.proto";

// Nocli AI补全服务
service NocliChat {
  // 发送消息
  rpc Completion(CompletionRequest) returns (CompletionResponse) {
    option (google.api.http) = {
      post: "/nocli/v1/completion"
      body: "*"
    };
  }

  // 恢复中断并继续对话
  rpc Resume(ResumeRequest) returns (CompletionResponse) {
    option (google.api.http) = {
      post: "/nocli/v1/resume"
      body: "*"
    };
  }
}

// 会话状态
enum SessionStatus {
  SS_UNSPECIFIED = 0;
  SS_IDLE = 1;        // 空闲/已完成
  SS_RUNNING = 2;     // 处理中
  SS_INTERRUPTED = 3; // 已中断，等待人工决策
}

// 中断事件状态
enum InterruptStatus {
  IS_UNSPECIFIED = 0;
  IS_PENDING = 1;  // 待审批
  IS_APPROVED = 2; // 已批准
  IS_REJECTED = 3; // 已拒绝
  IS_EXPIRED = 4;  // 已超时/取消
}

// 恢复执行动作
enum ResumeAction {
  RA_UNSPECIFIED = 0;
  RA_APPROVE = 1; // 批准执行
  RA_REJECT = 2;  // 拒绝执行
}

// 授权范围
enum ApproveScope {
  AS_UNSPECIFIED = 0;
  AS_SINGLE_CALL = 1;     // 仅同意本次调用
  AS_SESSION_TOOL = 2;    // 同意本轮/本会话后续所有同名工具调用
}

// 待确认的工具调用信息
message PendingToolCall {
  string interrupt_id = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string arguments = 4;
}

// 补全请求
message CompletionRequest {
  // 消息内容
  string message = 1 [(validate.rules).string.min_len = 1, (validate.rules).string.max_len = 4096];
  // 会话ID
  string session_id = 2;
  // 模型名称
  string model = 3;
}

// 补全响应
message CompletionResponse {
  // 回复内容
  string reply = 1;
  // 会话ID
  string session_id = 2;
  // 会话当前状态
  SessionStatus status = 3;
  // 待确认的工具调用列表 (当 status 为 SESSION_STATUS_INTERRUPTED 时有效)
  repeated PendingToolCall pending_tool_calls = 4;
}

// 恢复执行请求
message ResumeRequest {
  // 会话ID
  string session_id = 1 [(validate.rules).string.min_len = 1];
  // 中断事件ID
  string interrupt_id = 2 [(validate.rules).string.min_len = 1];
  // 恢复动作 (APPROVE/REJECT)
  ResumeAction action = 3;
  // 授权范围 (SINGLE_CALL/SESSION_TOOL)
  ApproveScope approve_scope = 4;
  // 拒绝原因或用户意见
  string reason = 5;
  // 模型名称
  string model = 6;
}

