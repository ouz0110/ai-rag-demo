syntax = "proto3";

package ai_rag_demo_api.nocli.v1;
option go_package = "nocli/v1;nocli";

import "google/api/annotations.proto";
import "validate/validate.proto";

// KnowledgeBase 知识库管理服务
service KnowledgeBase {
  // 创建新知识库 (POST 带 Body 参数)
  rpc CreateKnowledgeBase(CreateKnowledgeBaseRequest) returns (CreateKnowledgeBaseResponse) {
    option (google.api.http) = {
      post: "/nocli/v1/kb/create"
      body: "*"
    };
  }

  // 获取知识库列表 (纯查询 GET 接口)
  rpc ListKnowledgeBases(ListKnowledgeBasesRequest) returns (ListKnowledgeBasesResponse) {
    option (google.api.http) = {
      get: "/nocli/v1/kb/list"
    };
  }

  // 删除自定义知识库 (POST 带 Body 参数)
  rpc DeleteKnowledgeBase(DeleteKnowledgeBaseRequest) returns (DeleteKnowledgeBaseResponse) {
    option (google.api.http) = {
      post: "/nocli/v1/kb/delete"
      body: "*"
    };
  }

  // 获取知识库文档列表 (纯查询 GET 接口)
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (google.api.http) = {
      get: "/nocli/v1/kb/doc/list"
    };
  }

  // 删除文档及其关联切片 (POST 带 Body 参数)
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse) {
    option (google.api.http) = {
      post: "/nocli/v1/kb/doc/delete"
      body: "*"
    };
  }
}

// 知识库信息结构
message KnowledgeBaseInfo {
  // 知识库 UUID 标识
  string kb_id = 1;
  // 知识库名称
  string name = 2;
  // 知识库描述
  string description = 3;
  // 是否为系统默认公共知识库
  bool is_default = 4;
  // 创建时间戳 (秒)
  int64 created_at = 5;
  // 更新时间戳 (秒)
  int64 updated_at = 6;
}

// 文档详细信息结构
message DocumentInfo {
  string doc_id = 1;
  string kb_id = 2;
  string title = 3;
  string source_type = 4;
  string doc_version = 5;
  string category = 6;
  string tags = 7;
  int32 is_active = 8;
  string source_url = 9;
  string file_path = 10;
  string file_hash = 11;
  int32 status = 12; // 0:待处理, 1:解析中, 2:已向量化, 3:失败
  int32 total_chunks = 13;
  string err_msg = 14;
  int64 created_at = 15;
  int64 updated_at = 16;
}

// 创建知识库请求
message CreateKnowledgeBaseRequest {
  // 知识库名称
  string name = 1 [(validate.rules).string.min_len = 1, (validate.rules).string.max_len = 128];
  // 知识库描述
  string description = 2 [(validate.rules).string.max_len = 512];
}

// 创建知识库响应
message CreateKnowledgeBaseResponse {
  KnowledgeBaseInfo kb = 1;
}

// 列表查询请求
message ListKnowledgeBasesRequest {
}

// 列表查询响应
message ListKnowledgeBasesResponse {
  repeated KnowledgeBaseInfo kbs = 1;
}

// 删除知识库请求
message DeleteKnowledgeBaseRequest {
  string kb_id = 1 [(validate.rules).string.min_len = 1];
}

// 删除知识库响应
message DeleteKnowledgeBaseResponse {
  bool success = 1;
}

// 获取文档列表请求
message ListDocumentsRequest {
  string kb_id = 1;
}

// 获取文档列表响应
message ListDocumentsResponse {
  repeated DocumentInfo docs = 1;
}

// 删除文档请求
message DeleteDocumentRequest {
  string doc_id = 1 [(validate.rules).string.min_len = 1];
}

// 删除文档响应
message DeleteDocumentResponse {
  bool success = 1;
}


// 文件上传响应
message UploadFileResponse {
  string doc_id = 1;
  string kb_id = 2;
  string title = 3;
  string source_type = 4;
  int32 total_chunks = 5;
  int32 status = 6;
}